openapi: 3.0.3
info:
  title: Donaciones & Pagos API
  version: 1.0.0
  description: API for managing donors, donations, payments, and autocomplete.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:5000
    description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    PagedResult:
      type: object
      properties:
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/DonationDto'
              - $ref: '#/components/schemas/PaymentDto'
              - $ref: '#/components/schemas/DonorDto'
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    Currency:
      type: string
      enum: [pesos, dollars]
    Minian:
      type: string
      enum: [Ashkenazi, Sefaradi, Netz]
    DonationConcept:
      type: string
      enum: [Cohen, Levi, "3rd", "4th", "5th", "6th", Mosif, Mashlim]
    Destination:
      type: string
      enum: [Yeshiva, "Ashkenazi Minian", Other]
    DonorDto:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        observations: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
    DonationCreateDto:
      type: object
      required: [donorId, currency, amount, donationDate, minian, concept, destination]
      properties:
        donorId: { type: string, format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
        amount: { type: number, format: decimal, minimum: 0.01 }
        donationDate: { type: string, format: date }
        perasha: { type: string, nullable: true, maxLength: 200 }
        minian: { $ref: '#/components/schemas/Minian' }
        concept: { $ref: '#/components/schemas/DonationConcept' }
        destination: { $ref: '#/components/schemas/Destination' }
        destinationOther: { type: string, nullable: true, maxLength: 200 }
        comment: { type: string, nullable: true, maxLength: 1000 }
    DonationUpdateDto:
      allOf:
        - $ref: '#/components/schemas/DonationCreateDto'
      required: []
    DonationDto:
      allOf:
        - $ref: '#/components/schemas/DonationCreateDto'
      properties:
        id: { type: string, format: uuid }
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
    PaymentCreateDto:
      type: object
      required: [donorId, currency, paymentDate, concept]
      properties:
        donorId: { type: string, format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
        paymentDate: { type: string, format: date }
        concept: { type: string, minLength: 1, maxLength: 200 }
        collector: { type: string, nullable: true, maxLength: 200 }
        comment: { type: string, nullable: true, maxLength: 1000 }
    PaymentUpdateDto:
      allOf:
        - $ref: '#/components/schemas/PaymentCreateDto'
      required: []
    PaymentDto:
      allOf:
        - $ref: '#/components/schemas/PaymentCreateDto'
      properties:
        id: { type: string, format: uuid }
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            fullName: { type: string }
            roles:
              type: array
              items: { type: string }
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive a JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Unauthorized
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
  /api/donors:
    get:
      tags: [Donors]
      summary: List donors with optional name search
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedResult' }
    post:
      tags: [Donors]
      summary: Create donor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DonorDto' }
      responses:
        '201': { description: Created }
  /api/donors/{id}:
    get:
      tags: [Donors]
      summary: Get donor by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DonorDto' }
        '404': { description: Not found }
    put:
      tags: [Donors]
      summary: Update donor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DonorDto' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Donors]
      summary: Delete donor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: No Content }
  /api/donations:
    get:
      tags: [Donations]
      summary: List donations with filters
      parameters:
        - in: query
          name: donorId
          schema: { type: string, format: uuid }
        - in: query
          name: currency
          schema: { $ref: '#/components/schemas/Currency' }
        - in: query
          name: minian
          schema: { $ref: '#/components/schemas/Minian' }
        - in: query
          name: concept
          schema: { $ref: '#/components/schemas/DonationConcept' }
        - in: query
          name: destination
          schema: { $ref: '#/components/schemas/Destination' }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedResult' }
    post:
      tags: [Donations]
      summary: Create donation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DonationCreateDto' }
      responses:
        '201': { description: Created }
  /api/donations/{id}:
    get:
      tags: [Donations]
      summary: Get donation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DonationDto' }
        '404': { description: Not found }
    put:
      tags: [Donations]
      summary: Update donation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DonationUpdateDto' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Donations]
      summary: Delete donation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: No Content }
  /api/payments:
    get:
      tags: [Payments]
      summary: List payments with filters
      parameters:
        - in: query
          name: donorId
          schema: { type: string, format: uuid }
        - in: query
          name: currency
          schema: { $ref: '#/components/schemas/Currency' }
        - in: query
          name: collector
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedResult' }
    post:
      tags: [Payments]
      summary: Create payment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreateDto' }
      responses:
        '201': { description: Created }
  /api/payments/{id}:
    get:
      tags: [Payments]
      summary: Get payment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentDto' }
        '404': { description: Not found }
    put:
      tags: [Payments]
      summary: Update payment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentUpdateDto' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Payments]
      summary: Delete payment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: No Content }
  /api/autocomplete/perashot:
    get:
      tags: [Autocomplete]
      summary: Autocomplete for perasha
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /api/autocomplete/collectors:
    get:
      tags: [Autocomplete]
      summary: Autocomplete for collector
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /api/lookups:
    get:
      tags: [Lookups]
      summary: Get static lookups (minian, concepts, destinations, currencies)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  currencies:
                    type: array
                    items: { $ref: '#/components/schemas/Currency' }
                  minian:
                    type: array
                    items: { $ref: '#/components/schemas/Minian' }
                  donationConcepts:
                    type: array
                    items: { $ref: '#/components/schemas/DonationConcept' }
                  destinations:
                    type: array
                    items: { $ref: '#/components/schemas/Destination' }
